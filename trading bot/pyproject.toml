[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbot"
version = "0.1.0"
description = "Modular, broker-agnostic trading bot with a testable core"
readme = "README.md"
requires-python = ">=3.11"          # tomllib, and PEP 604 unions at runtime
license = { text = "MIT" }
dependencies = []                    # the core runs on the standard library alone

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]        # Windows only; needed for live/real data
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
tbot = "tbot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
packages = ["tbot"]
mypy_path = "src"
warn_unused_ignores = false
ignore_missing_imports = true       # MetaTrader5 ships no stubs
