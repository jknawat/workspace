[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tbot"
version = "0.1.0"
description = "Modular, broker-agnostic trading bot with a testable core"
readme = "README.md"
requires-python = ">=3.11"          # tomllib, and PEP 604 unions at runtime
license = { text = "MIT" }
dependencies = []                    # the core runs on the standard library alone

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]        # Windows only; needed for live/real data
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.8"]
# Only for scripts/llm_score_test.py, which asks whether an LLM rates signals
# better than the arithmetic scorer does. Nothing the bot does while trading
# imports this, and the core still runs on the standard library alone.
llm = ["anthropic>=0.40"]

[project.scripts]
tbot = "tbot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE is selected deliberately: catching bare `Exception` is worth flagging, and
# the handful of places that must (watchers, status reads, per-symbol isolation)
# each carry a noqa explaining why trading continuing matters more there.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "SLF", "BLE"]
ignore = [
    # `timezone.utc` reads better than `datetime.UTC` and works on every
    # supported version; the alias buys nothing here.
    "UP017",
    # Em dashes, arrows and box-drawing characters in docstrings and dashboard
    # copy are deliberate prose, not typos.
    "RUF001",
    "RUF002",
    "RUF003",
    # `Side(str, Enum)` is intentional: `.value` is used everywhere, and
    # StrEnum would silently change what `str(Side.LONG)` produces.
    "UP042",
    # `Strategy.reset()` is an optional hook with a working default, not an
    # abstract method every strategy must implement.
    "B027",
]

[tool.mypy]
python_version = "3.11"
packages = ["tbot"]
mypy_path = "src"
warn_unused_ignores = false
ignore_missing_imports = true       # MetaTrader5 ships no stubs
