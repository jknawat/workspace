# tbot -- global configuration.
# Per-symbol strategy settings live in config/symbols/*.toml (one file each).
# Environment overrides: TBOT_MODE, TBOT_BROKER, TBOT_TIMEFRAME,
# TBOT_BROKER_UTC_OFFSET_HOURS.

[engine]
mode = "paper"                  # backtest | paper | live
broker = "mt5"                  # paper | mt5   (data source in paper mode)
timeframe = "M5"
poll_seconds = 15               # how often to look for a newly closed bar
warmup_bars = 500               # history handed to the strategy each poll
# Exness-MT5Trial6 runs on UTC+0, measured by comparing a live tick's broker
# clock against real UTC. Exness also suffixes its symbols (EURUSDm), and both
# facts are per-broker -- re-measure the offset and re-check the names if you
# ever switch. This one setting governs bar timestamps, session filters,
# snapshot freshness and the chart overlay.
broker_utc_offset_hours = 0.0
start_balance = 10000.0         # backtest only -- paper mode mirrors the real
                                # account instead, see mirror_account_balance
mirror_account_balance = true   # size against money that actually exists
journal_path = "data/journal.sqlite"
stop_file = "data/STOP"        # stop.bat writes this; run.bat clears it

# Entries still trigger on [engine].timeframe above (M5). These are read for
# context only -- they inform, they never signal. MT5 has no 5h or 10h, so H4
# stands in for "about five hours" and H12 for "about ten".
context_timeframes = ["M1", "M15", "H1", "H4", "H12", "D1", "W1", "MN1"]
# Bars per context timeframe. Far more than the 200-bar trend EMA needs,
# on purpose: at 260 bars that EMA is still ~55% its own seed value.
context_bars = 1200

[risk]
risk_per_trade_pct = 1.0        # total, split across symbols by weight
max_daily_loss_pct = 3.0        # kill-switch for the UTC day
max_open_positions = 4
max_positions_per_symbol = 1
min_rr = 1.5                    # reject any signal whose tp/sl ratio is worse

[log]
level = "INFO"
file = "logs/tbot.jsonl"

[symbols]
dir = "symbols"                 # relative to this file

# --------------------------------------------------------------------------- #
# MT5 structure snapshots (SMC/ICT)
# --------------------------------------------------------------------------- #
# MetaTrader 5 does the pattern detection: attach SMC_Snapshot_Export.mq5 to a
# chart per symbol and it writes a JSON snapshot to MT5's shared Common folder
# on every bar close. See docs/MT5_SNAPSHOT_SETUP.md. Check it with:
#   tbot snapshot -c config/bot.toml --symbol EURUSD

[snapshot]
enabled = true             # set true once the EA is attached and exporting
folder = "SMC_Export"      # must match the EA's InpFolder input
common_path = ""           # blank auto-detects %APPDATA%\MetaQuotes\Terminal\Common\Files
timeframe = ""             # blank follows [engine].timeframe
max_age_minutes = 0.0      # 0 = three bars of the snapshot timeframe
require_fresh = true       # stale or missing structure blocks ICT gates

# --------------------------------------------------------------------------- #
# Watchers: dashboard, Telegram, MT5 chart overlay
# --------------------------------------------------------------------------- #
# All three are read-only views of the bot, except Telegram commands, which set
# flags the trading thread acts on itself. None of them can bypass the risk gate.

[dashboard]
enabled = true             # local web view of state, positions and activity
host = "127.0.0.1"         # loopback only; changing this exposes your balance
port = 8787

[telegram]
enabled = false
# Put the token and chat id in config/credentials.toml (gitignored) or in
# TBOT_TELEGRAM_TOKEN / TBOT_TELEGRAM_CHAT_ID. Run: tbot telegram-setup
events = ["order", "closed", "error", "started", "stopped"]
accept_commands = true     # /status /pause /resume /closeall /stop

[overlay]
enabled = false            # write tbot's own state back to MT5 for TbotOverlay.mq5
folder = ""                # blank reuses [snapshot].folder
filename = "tbot_state.json"
