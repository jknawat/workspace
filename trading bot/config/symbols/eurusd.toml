symbol = "EURUSDm"
strategy = "ema_pullback"
enabled = false
weight = 3.0          # relative; weights are renormalised across enabled symbols
sides = ["LONG", "SHORT"]

[session]
start = "07:00"       # UTC, always. Broker offset is handled once, in [engine].
end = "16:00"
weekdays = [0, 1, 2, 3, 4]

[params]
ema_confirm = 5
ema_fast = 8
ema_medium = 13
ema_slow = 21
ema_trend = 200
atr_period = 14
use_pullback = true
pullback_bars = 2
pullback_max_wait = 10
window_offset_atr = 0.25
window_bars = 5
sl_atr = 2.5
tp_atr = 6.0
cooldown_bars = 3

[filters.session]

[filters.atr_range]
min = 0.0002
max = 0.0020

[filters.ema_order]
series = ["ema_confirm", "ema_fast", "ema_medium", "ema_slow"]

[filters.price_vs_ema]
series = "ema_trend"

[filters.angle]
series = "slope"
min_degrees = 15.0

[filters.candle_direction]
bars = 1
offset = 0

[filters.spread]
max_points = 25

# ICT as a *filter* on the mechanical crossover entries above: uncomment to
# require that MT5's structure agrees before any EMA signal is taken. Needs
# [snapshot].enabled = true, and will block every entry without a fresh export.
# [filters.ict_snapshot]
#
# [filters.ict_bias]
# concepts = ["BOS", "CHOCH", "MSS"]

# Position management after entry. Policies run in the order written, once per
# closed bar. Stops only ever move in the protective direction.
[exits.break_even]
trigger_r = 1.0        # once 1R ahead, move the stop to entry
offset_r = 0.05        # ...plus a little, so the trade covers its costs

[exits.trailing_atr]
distance_atr = 2.0
start_r = 1.5          # don't trail until the trade is properly ahead

[exits.time_stop]
max_bars = 96          # 8 hours on M5
min_r = 0.5            # unless it is working, then let it run
