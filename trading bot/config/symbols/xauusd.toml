# Gold on Exness. The only enabled symbol, so it carries the whole 1% budget.
#
# Filter bounds below are measured from 1,500 live M5 bars (2026-09-22 to
# 09-29, price ~4,150), not guessed. Re-measure after any major regime change:
#   .venv\Scripts\python.exe scripts\profile_symbol.py XAUUSDm

symbol = "XAUUSDm"
strategy = "ema_pullback"
enabled = true
weight = 2.0
sides = ["LONG", "SHORT"]   # both directions: bull and bear

[session]
start = "08:00"       # UTC. Exness server time is UTC+0, so these match.
end = "20:00"

[params]
ema_confirm = 5
ema_fast = 8
ema_medium = 21
ema_slow = 34
ema_trend = 200
atr_period = 14
use_pullback = true
pullback_bars = 2        # 3 left too little room to complete before invalidation
window_offset_atr = 0.4
window_bars = 8

# Scale the slope by ATR, not by point. Gold's point is 0.001 while its bars
# move whole dollars, so point scaling pins every reading at ~89.9 degrees and
# the angle filter below would pass everything. With ATR scaling, 45 degrees
# means "one ATR per bar".
slope_scale = "atr"
slope_source = "ema_medium"
slope_lookback = 5

sl_atr = 3.0          # ~13.9 at median ATR -> 0.07 lots for $100 risk
tp_atr = 7.5
cooldown_bars = 6

[filters.session]

# Measured ATR(14): min 2.42, p5 2.93, median 4.62, p95 7.18, max 7.98.
# The old 0.8-12.0 band admitted every single bar -- a filter that never
# rejects is not a filter. This one trims the quiet and frantic extremes.
[filters.atr_range]
min = 2.9
max = 7.2

[filters.price_vs_ema]
series = "ema_trend"

# DISABLED on evidence, not taste.
#
# Over 60,000 M5 bars (310 days), with every other gate unchanged:
#   with angle      8 trades   12.5% win   -354   pf 0.39
#   without angle 117 trades   29.9% win   +902   pf 1.13
# and split in half, removing it is positive in both periods (pf 1.05 then
# 1.22, drawdown under 13%) rather than in one lucky stretch.
#
# Why it fails here: the gate measures the slope of a smoothed EMA21, which
# barely moves in ATR terms, so any threshold either passes everything (the
# old point scaling, pinned at ~89.9 deg) or strangles the strategy. It was
# costing 13x the trades and turning a thin edge into a loss.
#
# Left in place, disabled, because the reasoning is worth more than the line.
[filters.angle]
enabled = false
min_degrees = 3.0

# Gold's live spread is ~240 points (point = 0.001, so $0.24). The 60 here
# before was carried over from forex and would have rejected every single
# trade. 400 allows normal conditions and still catches real widening.
# One observation at 10:20 UTC -- watch the rejection counts in `tbot report`.
[filters.spread]
max_points = 400

# --------------------------------------------------------------------------- #
# Multi-timeframe context
# --------------------------------------------------------------------------- #
# M5 triggers the entry; these decide whether the wider picture agrees. A
# timeframe counts as bullish only when price is above its trend EMA *and* its
# fast EMA is above its slow one -- otherwise it reads neutral, which is the
# honest answer rather than a coin flip. Works identically for shorts.

# At least two context timeframes must point the same way as the trade, and no
# more than three may point against it. Disagreement is counted separately from
# agreement because neutral is neither, and two timeframes actively opposing a
# trade matters more than four being undecided.
[filters.mtf_align]
timeframes = ["M15", "H1", "H4", "H12", "D1"]
min_agree = 2
max_disagree = 3

# Never fight the daily. Neutral is allowed -- it is not opposition.
[filters.mtf_required]
timeframes = ["D1"]
allow_neutral = true

# --------------------------------------------------------------------------- #
# Signal rating
# --------------------------------------------------------------------------- #
#
# Every signal that clears the gates is scored 0-100 on the evidence behind it,
# and the score can scale the stake. Right now it only *measures*: min_score 0
# with a single full-size tier means behaviour is identical to having no
# scoring at all, while the number is computed, shown in the panel and written
# to the journal.
#
# That is deliberate. Measured over the 310-day gold set (scripts/score_report.py):
#
#     band    trades   win%        net   per trade    pf
#     30-44        9  22.2%    -218.11      -24.23  0.70
#     45-59       40  35.0%   +1021.47      +25.54  1.40
#     60-74       54  27.8%    +166.79       +3.09  1.04
#     75-87       22  36.4%    +650.51      +29.57  1.51
#
# Expectancy does not rise with the score -- the 60s band is the weakest of the
# three that trade. So the score does not yet rank trades reliably, and sizing
# to it would be staking money on a pattern that is not there. Gating at 45 was
# also tried: better over the full period (+1898 vs +1621) but worse in the
# first half of it (+381 vs +652), which is the signature of one lucky stretch.
#
# No band above 87 has ever occurred, so a "90%" or "95%" tier would never fire.
#
# To stake on the score once forward trading has produced uncontaminated
# evidence, raise min_score and add tiers. The shape, for when that day comes:
#
#   min_score = 45
#   [[confidence.tiers]]
#   min_score = 45
#   risk_mult = 0.4      # 0.4 of [risk].risk_per_trade_pct, not 0.4 lots
#   label = "lean"
#   [[confidence.tiers]]
#   min_score = 75
#   risk_mult = 1.0
#   label = "strong"
#
# risk_mult scales the *risk*, not the lot count: a 0.02-lot trade with a
# double-width stop risks twice as much, so sizing by lots would quietly break
# the 1% rule. Lots are still worked out from the stop distance.
[confidence]
enabled = true
min_score = 0.0          # measure only; nothing is refused for a low score

[[confidence.tiers]]
min_score = 0.0
risk_mult = 1.0
label = "measuring"
