# ICT/SMC entries driven entirely by MetaTrader 5's structure snapshot.
#
# Disabled by default: it needs [snapshot].enabled = true in bot.toml and the
# SMC_Snapshot_Export EA attached to a GBPUSD chart. Without a fresh snapshot
# this strategy takes no trades at all -- by design, it fails closed.
# See docs/ICT_STRATEGY.md and docs/MT5_SNAPSHOT_SETUP.md.

symbol = "GBPUSD"
strategy = "ict_confluence"
enabled = false
weight = 2.0
sides = ["LONG", "SHORT"]

[session]
start = "07:00"
end = "16:00"

[params]
# Which zones count as an entry area, and how fresh they must be.
zone_concepts = ["ORDER_BLOCK", "FVG", "BREAKER"]
zone_states = []              # e.g. ["fresh"] once you have seen your library's states
zone_tolerance_points = 20.0  # a near-miss wick still counts
zone_max_age_minutes = 480.0
zone_min_strength = 0.0

# Direction comes from the newest confirmed structural event.
require_bias = true
bias_concepts = ["BOS", "CHOCH", "MSS"]

# Confirmation before entering: a close in the trade direction inside the zone.
confirmation = "candle"       # none | candle | structure
confirm_max_bars = 3

# Exits: stop beyond the zone edge, target 2R.
atr_period = 14
sl_buffer_atr = 0.5
min_sl_atr = 0.5              # reject stops so tight the lot size explodes
max_sl_atr = 6.0
target = "rr"                 # or "liquidity" to aim at the next pool
tp_rr = 2.0
cooldown_bars = 6
one_entry_per_zone = true

# Gates. Each fails closed when structure is unavailable.
[filters.ict_snapshot]
concepts = ["ORDER_BLOCK", "FVG"]

[filters.session]

[filters.ict_killzone]
names = ["london", "new york"]

[filters.ict_premium_discount]

[filters.spread]
max_points = 30

# Optional extras, off until you have checked them against your own data:
# [filters.ict_liquidity_swept]
# states = ["swept"]
# direction = "agree"
#
# [filters.ict_no_opposing_zone]
# distance_points = 200
