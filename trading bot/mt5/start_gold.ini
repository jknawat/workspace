; MetaTrader 5 startup config used by run.bat.
;
; Two jobs:
;   1. Pin the account. The terminal can hold several saved logins and will
;      happily open a different one on restart -- which silently changes both
;      the symbol names (EURUSD vs EURUSDm) and the server's UTC offset. The
;      bot then fails with "symbol not available in Market Watch", which does
;      not sound like the account problem it is.
;   2. Attach the SMC/ICT snapshot exporter to the gold chart, so structure is
;      published for the symbol actually being traded.
;
; The password is the one the terminal already saved. Change Login/Server here
; if you switch broker, and re-measure [engine].broker_utc_offset_hours.

[Common]
Login=414381398
Server=Exness-MT5Trial6

[Experts]
AllowLiveTrading=1
Enabled=1

[StartUp]
Expert=SMC_Snapshot_Export
Symbol=XAUUSDm
Period=M5
