<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JK Central Center</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #fdf6ec;
      --warm: #f5e6cc;
      --card-bg: #fffaf3;
      --accent: #e8956d;
      --accent2: #d4755a;
      --text-dark: #3a2a1a;
      --text-mid: #6b4c30;
      --text-light: #a07850;
      --border: #e8d5b5;
      --shadow: rgba(180, 120, 60, 0.15);
      --tag-bg: #f0dfc0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--cream);
      color: var(--text-dark);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #f5e0c0 0%, #eecfa0 100%);
      border-bottom: 2px solid var(--border);
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 12px var(--shadow);
    }

    .header-left h1 {
      font-size: 2rem;
      font-weight: 900;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .header-left h1 span { color: var(--accent); }

    .header-left p {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 2px;
    }

    .header-right { display: flex; gap: 16px; }

    .stat-pill {
      background: white;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 8px 18px;
      text-align: center;
      box-shadow: 0 2px 6px var(--shadow);
    }

    .stat-pill .num {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--accent);
      display: block;
    }

    .stat-pill .lbl {
      font-size: 0.7rem;
      color: var(--text-light);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* NAV */
    nav {
      background: var(--warm);
      border-bottom: 1.5px solid var(--border);
      padding: 0 40px;
      display: flex;
      gap: 4px;
    }

    .tab {
      padding: 14px 22px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-light);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab:hover { color: var(--accent); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* MAIN */
    main {
      padding: 36px 40px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .section { display: none; }
    .section.active { display: block; }

    .section-title {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-dark);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::after {
      content: '';
      flex: 1;
      height: 2px;
      background: var(--border);
      border-radius: 2px;
    }

    /* AGENT CARD GRID */
    .agent-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      margin-bottom: 48px;
    }

    .card-wrap {
      perspective: 1000px;
      height: 340px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    }

    .card-wrap:hover .card-inner {
      transform: rotateY(180deg);
    }

    .card-front,
    .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid var(--border);
      box-shadow: 0 6px 24px var(--shadow);
    }

    /* FRONT */
    .card-front {
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .card-portrait {
      width: 100%;
      height: 220px;
      object-fit: cover;
      object-position: top center;
    }

    .card-nameplate {
      padding: 14px 16px 16px;
      width: 100%;
      text-align: center;
    }

    .card-name {
      font-size: 1.25rem;
      font-weight: 900;
      color: var(--text-dark);
    }

    .card-codename {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .card-role {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-top: 6px;
      display: inline-block;
      background: var(--tag-bg);
      padding: 3px 12px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* BACK */
    .card-back {
      background: linear-gradient(160deg, #fff8ee 0%, #fdefd8 100%);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      padding: 20px 18px;
      justify-content: space-between;
    }

    .back-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .back-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      object-position: top;
      border: 2.5px solid var(--accent);
      flex-shrink: 0;
    }

    .back-names .name { font-size: 1rem; font-weight: 900; color: var(--text-dark); }
    .back-names .codename { font-size: 0.7rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; }

    .back-section { margin-bottom: 8px; }

    .back-label {
      font-size: 0.63rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .back-text {
      font-size: 0.76rem;
      color: var(--text-mid);
      line-height: 1.45;
      font-weight: 600;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 3px;
    }

    .tag {
      background: var(--accent);
      color: white;
      font-size: 0.63rem;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 700;
    }

    .back-motto {
      background: var(--tag-bg);
      border-left: 3px solid var(--accent);
      padding: 7px 11px;
      border-radius: 0 8px 8px 0;
      font-size: 0.73rem;
      font-style: italic;
      color: var(--text-mid);
      font-weight: 700;
    }

    /* PROJECTS TABLE */
    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .btn-add {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
      transition: background 0.2s;
    }

    .btn-add:hover { background: var(--accent2); }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px var(--shadow);
      border: 1.5px solid var(--border);
    }

    thead { background: linear-gradient(135deg, #f5e0c0, #eecfa0); }

    th {
      padding: 14px 18px;
      text-align: left;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-mid);
    }

    td {
      padding: 14px 18px;
      font-size: 0.85rem;
      color: var(--text-dark);
      border-top: 1px solid var(--border);
      font-weight: 600;
    }

    tr:hover td { background: #fdf0de; }

    .status-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-done { background: #d4f5d4; color: #2a7a2a; }
    .status-progress { background: #fff0d0; color: #a06010; }
    .status-todo { background: #f0f0f0; color: #606060; }

    .priority-high { color: #c0392b; font-weight: 800; }
    .priority-medium { color: #e67e22; font-weight: 800; }
    .priority-low { color: #27ae60; font-weight: 800; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(80, 40, 10, 0.4);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 32px;
      width: 440px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      border: 2px solid var(--border);
    }

    .modal h3 {
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 20px;
      color: var(--text-dark);
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-light);
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 0.88rem;
      font-family: 'Nunito', sans-serif;
      background: white;
      color: var(--text-dark);
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .btn-cancel {
      background: var(--tag-bg);
      color: var(--text-mid);
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }

    .btn-save {
      background: var(--accent);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Nunito', sans-serif;
    }

    .btn-save:hover { background: var(--accent2); }

    @media (max-width: 1100px) { .agent-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 800px) {
      header { padding: 18px 20px; flex-direction: column; gap: 16px; }
      nav { padding: 0 20px; overflow-x: auto; }
      main { padding: 24px 20px; }
      .agent-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 500px) { .agent-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>JK <span>Central Center</span></h1>
    <p>AI Agent Team Dashboard &mdash; May 2026</p>
  </div>
  <div class="header-right">
    <div class="stat-pill">
      <span class="num">8</span>
      <span class="lbl">Agents</span>
    </div>
    <div class="stat-pill">
      <span class="num" id="stat-projects">4</span>
      <span class="lbl">Projects</span>
    </div>
    <div class="stat-pill">
      <span class="num" id="stat-done">0</span>
      <span class="lbl">Done</span>
    </div>
  </div>
</header>

<nav>
  <div class="tab active" data-tab="agents">Team</div>
  <div class="tab" data-tab="projects">Projects</div>
  <a href="tools/index.html" class="tab" style="text-decoration:none;">🔧 Tools</a>
</nav>

<main>
  <section id="section-agents" class="section active">
    <div class="section-title">Meet the Team</div>
    <div class="agent-grid" id="agent-grid"></div>
  </section>

  <section id="section-projects" class="section">
    <div class="section-title">Projects</div>
    <div class="project-header">
      <span style="font-size:0.85rem;color:var(--text-light);font-weight:600;" id="project-count"></span>
      <button class="btn-add" onclick="openModal()">+ New Project</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Project</th>
          <th>Description</th>
          <th>Status</th>
          <th>Agent</th>
          <th>Priority</th>
          <th>Updated</th>
        </tr>
      </thead>
      <tbody id="project-table"></tbody>
    </table>
  </section>
</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>New Project</h3>
    <div class="form-group">
      <label>Project Name</label>
      <input type="text" id="inp-name" placeholder="e.g. STL Shop Landing Page" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="inp-desc" rows="2" placeholder="What is this project about?"></textarea>
    </div>
    <div class="form-group">
      <label>Agent</label>
      <select id="inp-agent">
        <option>Claudy</option><option>Rex</option><option>Mia</option><option>Cole</option>
        <option>Iris</option><option>Max</option><option>Kay</option><option>Sam</option><option>All</option>
      </select>
    </div>
    <div class="form-group">
      <label>Priority</label>
      <select id="inp-priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveProject()">Save</button>
    </div>
  </div>
</div>

<script>
const agents = [
  {
    id: "claudy", name: "Claudy", codename: "Orchestrator", role: "Chief of Staff",
    personality: "Calm, strategic, always in control. The glue that holds the team together.",
    does: "Coordinates all agents, talks to JK, compiles results into clear answers.",
    skills: ["Coordination", "Routing", "Summarizing"],
    motto: "I make sure the right person handles the right job."
  },
  {
    id: "rex", name: "Rex", codename: "Scout", role: "Research Agent",
    personality: "Curious and fast. Always digging for the latest info online.",
    does: "Web search, market trends, competitor analysis, prices.",
    skills: ["Research", "Trends", "Market Intel"],
    motto: "If it's out there, I'll find it."
  },
  {
    id: "mia", name: "Mia", codename: "Spark", role: "Thinking Agent",
    personality: "Creative and analytical. Loves breaking down big problems into clear steps.",
    does: "Brainstorming, planning, analysis, and decision support.",
    skills: ["Strategy", "Planning", "Ideation"],
    motto: "Every problem has a smarter solution."
  },
  {
    id: "cole", name: "Cole", codename: "Byte", role: "Coding Agent",
    personality: "Precise and methodical. Gets the code right.",
    does: "Writing Python & C code, fixing bugs, explaining how code works.",
    skills: ["Python", "C", "Debugging"],
    motto: "Clean code, no excuses."
  },
  {
    id: "iris", name: "Iris", codename: "Pixel", role: "Design Agent",
    personality: "Artistic and detail-oriented. Makes everything look beautiful.",
    does: "Generating images, product mockups, social media graphics.",
    skills: ["Image Gen", "Mockups", "Visual Design"],
    motto: "A picture is worth a thousand words."
  },
  {
    id: "max", name: "Max", codename: "Boss", role: "Business Agent",
    personality: "Sharp and goal-focused. Always thinking about money and strategy.",
    does: "Business advice, pricing, sales strategy, and marketing plans.",
    skills: ["Strategy", "Pricing", "Marketing"],
    motto: "Every decision should make money."
  },
  {
    id: "kay", name: "Kay", codename: "Reel", role: "Content Agent",
    personality: "Energetic and creative. Knows what makes people stop scrolling.",
    does: "TikTok & YouTube scripts, product descriptions, captions and hashtags.",
    skills: ["Scripting", "Copywriting", "Hashtags"],
    motto: "Hook them in 3 seconds."
  },
  {
    id: "sam", name: "Sam", codename: "Webb", role: "Web App Agent",
    personality: "Clean and practical. Builds things that just work.",
    does: "Landing pages, dashboards, and web tools in HTML/CSS/JS.",
    skills: ["HTML", "CSS", "JavaScript"],
    motto: "Build it clean, build it fast."
  }
];

function renderAgents() {
  document.getElementById('agent-grid').innerHTML = agents.map(a => `
    <div class="card-wrap">
      <div class="card-inner">
        <div class="card-front">
          <img class="card-portrait" src="agents/${a.id}.jpg" alt="${a.name}"
               onerror="this.style.background='#f0dfc0';this.style.height='220px'">
          <div class="card-nameplate">
            <div class="card-name">${a.name}</div>
            <div class="card-codename">${a.codename}</div>
            <div class="card-role">${a.role}</div>
          </div>
        </div>
        <div class="card-back">
          <div>
            <div class="back-header">
              <img class="back-avatar" src="agents/${a.id}.jpg" alt="${a.name}">
              <div class="back-names">
                <div class="name">${a.name}</div>
                <div class="codename">${a.codename}</div>
              </div>
            </div>
            <div class="back-section">
              <div class="back-label">Personality</div>
              <div class="back-text">${a.personality}</div>
            </div>
            <div class="back-section">
              <div class="back-label">What I Do</div>
              <div class="back-text">${a.does}</div>
            </div>
            <div class="back-section">
              <div class="back-label">Skills</div>
              <div class="tag-list">${a.skills.map(s=>`<span class="tag">${s}</span>`).join('')}</div>
            </div>
          </div>
          <div class="back-motto">"${a.motto}"</div>
        </div>
      </div>
    </div>
  `).join('');
}

let projects = [];

async function loadProjects() {
  try {
    const r = await fetch('projects.json');
    projects = await r.json();
  } catch { projects = []; }
  renderProjects();
  updateStats();
}

function renderProjects() {
  const sc = { done:'status-done', 'in-progress':'status-progress', todo:'status-todo' };
  const sl = { done:'Done', 'in-progress':'In Progress', todo:'To Do' };
  document.getElementById('project-table').innerHTML = projects.map(p => `
    <tr>
      <td style="color:var(--text-light);font-weight:800;">#${p.id}</td>
      <td style="font-weight:800;">${p.name}</td>
      <td style="color:var(--text-mid);">${p.description}</td>
      <td><span class="status-badge ${sc[p.status]||'status-todo'}">${sl[p.status]||p.status}</span></td>
      <td>${p.agent}</td>
      <td class="priority-${p.priority}">${p.priority.charAt(0).toUpperCase()+p.priority.slice(1)}</td>
      <td style="color:var(--text-light);">${p.updated}</td>
    </tr>
  `).join('');
  document.getElementById('project-count').textContent = `${projects.length} project${projects.length!==1?'s':''}`;
}

function updateStats() {
  document.getElementById('stat-projects').textContent = projects.length;
  document.getElementById('stat-done').textContent = projects.filter(p=>p.status==='done').length;
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-desc').value = '';
}

function saveProject() {
  const name = document.getElementById('inp-name').value.trim();
  if (!name) return;
  const today = new Date().toISOString().split('T')[0];
  projects.push({
    id: projects.length + 1,
    name,
    description: document.getElementById('inp-desc').value.trim(),
    status: 'todo',
    agent: document.getElementById('inp-agent').value,
    priority: document.getElementById('inp-priority').value,
    created: today,
    updated: today
  });
  renderProjects();
  updateStats();
  closeModal();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('section-' + tab.dataset.tab).classList.add('active');
  });
});

renderAgents();
loadProjects();
</script>
</body>
</html>
